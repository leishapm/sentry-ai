databases:
  - name: sentry-db
    databaseName: sentry
    user: sentry
    plan: free

services:
  - type: web
    name: sentry-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: APP_NAME
        value: SENTRY API
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: sentry-db
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: CORS_ALLOW_CREDENTIALS
        value: "true"
      - key: WATSONX_API_KEY
        sync: false
      - key: WATSONX_PROJECT_ID
        sync: false
      - key: WATSONX_URL
        value: https://us-south.ml.cloud.ibm.com
      - key: WATSONX_MODEL_ID
        value: ibm/granite-4-h-small
